.vh{position:absolute;left:-9999px}
header img{width:68px;height:auto;flex:none}
header p{margin:2px 0 0;font-size:13px;color:var(--gd);font-weight:600}
.strip{height:5px;background:linear-gradient(90deg,#e4002b 0 33.3%,#00a859 33.3% 66.6%,#0066b3 66.6%)}
.ft{text-align:center;color:var(--mut);font-size:12px;padding:0 12px 24px}
h1{margin:0;font-size:21px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--hd)}
.tabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.tabs button.on{background:var(--gd);color:#2a060d}
main{max-width:860px;margin:0 auto;padding:12px 12px 40px}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sub button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}
.sub button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-size:12px}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
td.p{font-weight:700;color:var(--ac)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0 2px}
.m .h{text-align:right}
.m .r{background:var(--ac2);color:var(--ac);font-weight:700;border-radius:8px;padding:3px 10px;min-width:62px;text-align:center}
.m .r.pend{background:transparent;color:var(--mut);font-weight:400}
.inf{text-align:center;color:var(--mut);font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.card .inf:last-child{border-bottom:0}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.msg{background:var(--ac2);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.champ{background:var(--hd);color:var(--gd);border:1px solid var(--gd);border-radius:12px;padding:12px;text-align:center;font-weight:700;margin-bottom:12px}
.mr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.mr .ml{flex:1 1 100%;font-weight:600;font-size:13px}
.mr input,.mr select,.f input,.f select{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.mr input[type=number]{width:62px}
.mr .w2{flex:1 1 150px}
.f{display:flex;gap:6px;flex-wrap:wrap}
.f>*{flex:1 1 110px}
.f button,.x{border:0;border-radius:8px;background:var(--ac);color:var(--on);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.x{background:none;color:var(--mut);padding:2px 8px}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.br{display:flex;gap:26px;overflow-x:auto;padding:6px 2px 12px}
.bc{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:178px}
.pr{display:flex;flex-direction:column;justify-content:space-around;gap:14px;position:relative}
.pr::after{content:'';position:absolute;right:-13px;top:25%;bottom:25%;width:13px;border:2px solid var(--bd);border-left:0}
.pr::before{content:'';position:absolute;right:-26px;top:50%;width:13px;border-top:2px solid var(--bd)}
.bx{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;font-size:13px}
